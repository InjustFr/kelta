[workspace]
resolver = "3"
members = [
  "crates/*",
  "apps/desktop/src-tauri",
  "xtask",
  "bench",
  "fixtures/tui-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Kelta contributors"]
repository = "https://github.com/kelta-dev/kelta"
publish = false

[workspace.dependencies]
# ---- internal crates -------------------------------------------------------
kelta-proto = { path = "crates/kelta-proto" }
kelta-term = { path = "crates/kelta-term" }
kelta-config = { path = "crates/kelta-config" }
kelta-secrets = { path = "crates/kelta-secrets" }
kelta-http = { path = "crates/kelta-http" }
kelta-trackers = { path = "crates/kelta-trackers" }
kelta-codehosts = { path = "crates/kelta-codehosts" }
kelta-work = { path = "crates/kelta-work" }
kelta-server = { path = "crates/kelta-server" }
kelta-plugins = { path = "crates/kelta-plugins" }
kelta-core = { path = "crates/kelta-core" }

# ---- desktop (ARCHITECTURE §1.1) -------------------------------------------
tauri = { version = "=2.12.2" }
tauri-build = { version = "=2.7.1" }
tauri-plugin-notification = { version = "=2.5.1" }
tauri-plugin-opener = { version = "=2.7.0" }
tauri-plugin-single-instance = { version = "=2.5.2" }

# ---- async / OS --------------------------------------------------------------
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "fs", "signal"] }
portable-pty = { version = "=0.9.0" }
alacritty_terminal = { version = "=0.26.0", default-features = false }
rustix = { version = "=1.1.5", features = ["std", "pty", "process", "event", "net", "termios", "fs"] }
libc = { version = "=0.2.190" }

# ---- network ---------------------------------------------------------------
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "gzip", "http2", "query", "system-proxy"] }
axum = { version = "=0.8.9", features = ["ws"] }
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "tokio", "http1"] }
http-body-util = { version = "=0.1.5" }
tokio-tungstenite = { version = "=0.30.0" }
rmpv = { version = "=1.3.1" }

# ---- storage / config ------------------------------------------------------
rusqlite = { version = "=0.40.2", features = ["bundled"] }
toml = { version = "=1.1.8" }
toml_edit = { version = "=0.25.17" }
schemars = { version = "=1.2.2" }
jsonschema = { version = "=0.58.6", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
notify = { version = "=8.2.0" }
notify-debouncer-full = { version = "=0.7.0" }

# ---- secrets / platform ----------------------------------------------------
keyring-core = { version = "=1.0.0" }
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
objc2 = { version = "=0.6.5" }
objc2-foundation = { version = "=0.3.2" }
objc2-web-kit = { version = "=0.3.2" }
webkit2gtk = { version = "=2.0.2" }

# ---- text / markdown -------------------------------------------------------
pulldown-cmark = { version = "=0.13.4" }
ammonia = { version = "=4.2.1" }
regex = { version = "=1.13.1" }
globset = { version = "=0.4.20" }

# ---- misc ------------------------------------------------------------------
uuid = { version = "=1.27.0", features = ["v4", "v7", "serde"] }
directories = { version = "=6.0.0" }
which = { version = "=8.0.6" }
thiserror = { version = "=2.0.21" }
anyhow = { version = "=1.0.104" }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = { version = "=0.2.5" }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
async-trait = { version = "=0.1.92" }
base64 = { version = "=0.23.1" }
sha2 = { version = "=0.11.0" }
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
bytes = { version = "=1.12.1" }
parking_lot = { version = "=0.12.5" }
futures = { version = "=0.3.34" }
semver = { version = "=1.0.28", features = ["serde"] }
mime_guess = { version = "=2.0.5" }

# ---- dev ---------------------------------------------------------------------
insta = { version = "=1.49.0", features = ["json", "redactions"] }
wiremock = { version = "=0.6.5" }
proptest = { version = "=1.11.0" }
tempfile = { version = "=3.27.0" }
criterion = { version = "=0.8.2" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.release-ctl]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
debug = false
