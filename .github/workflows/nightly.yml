name: nightly

# Manual only: unsigned macOS Apple silicon dmg (what the README ships; release.yml keeps the universal one),
# Linux AppImage + deb and the macOS cargo --timings report, kept as run artifacts. Nothing is published: the rolling
# "nightly" prerelease (signed, with latest.json) comes from scripts/nightly-local.sh only.
on:
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # the ghcr.io/injustfr/kelta-ci image

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    # The prebuilt image (ci-image.yml) has the system packages and the Rust toolchain.
    container:
      image: ghcr.io/injustfr/kelta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1" # no FUSE in a container for linuxdeploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/dev.kelta.Kelta.desktop
          appstreamcli validate --no-net packaging/linux/dev.kelta.Kelta.metainfo.xml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release # nightly and release share their release builds
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: bash packaging/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      # Its own key: the universal release job caches target/<triple>/release, this host build target/release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-host
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # No APPLE_* variables: the app is built unsigned.
      - run: bash packaging/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/

