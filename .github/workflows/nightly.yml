name: nightly

# Every night (and on a manual run): the newest main commit with a green `ci` push run, unless the `nightly` tag
# is already on it, built as the macOS Apple silicon dmg + updater bundle (unsigned for Apple; release.yml keeps
# the universal one) and the Linux deb + AppImage for amd64 and arm64 (native runners), the updater bundles signed
# with the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets, then published to the rolling "nightly" prerelease by
# scripts/publish-nightly.sh. scripts/nightly-local.sh is the same publish from the maintainer's Mac.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false # a cancelled publish would leave the release half updated

permissions:
  contents: read
  packages: read # the ghcr.io/injustfr/kelta-ci image

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # gh run list
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          # An unsigned nightly would strand every installed copy: refuse before building anything.
          [[ "$HAS_KEY" == true ]] || { echo "::error::updater key secrets missing (CONTRIBUTING, Nightly builds)"; exit 1; }
          # The gate: ci's main push runs cover both OSes; docs-only commits have no run and are not needed.
          sha="$(gh run list -w ci.yml -b main -e push -s success -L 1 --json headSha --jq '.[0].headSha')"
          [[ -n "$sha" ]] || { echo "::error::no green ci push run on main"; exit 1; }
          build=true
          if [[ "$(git ls-remote origin refs/tags/nightly | cut -f1)" == "$sha" ]]; then
            build=false; echo "::notice::nightly is already $sha"
          fi
          # The updater compares this version; the Cargo version (bin/<version>/ dirs) stays as it is.
          base="$(git show "$sha:apps/desktop/src-tauri/tauri.conf.json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          { echo "sha=$sha"; echo "build=$build"; echo "version=$base-nightly.$(date -u +%Y%m%d%H%M)"; } >> "$GITHUB_OUTPUT"

  linux:
    needs: prep
    if: needs.prep.outputs.build == 'true'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The prebuilt image (ci-image.yml, amd64 + arm64) has the system packages and the Rust toolchain.
    container:
      image: ghcr.io/injustfr/kelta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1" # no FUSE in a container for linuxdeploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/dev.kelta.Kelta.desktop
          appstreamcli validate --no-net packaging/linux/dev.kelta.Kelta.metainfo.xml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release # nightly and release share their release builds
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The signing key only reaches this step.
      - env:
          KELTA_VERSION: ${{ needs.prep.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash packaging/build.sh
      # Flat: several paths would upload as deb/ and appimage/ folders, which publish-nightly.sh does not read.
      - run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-linux-${{ runner.arch }}
          if-no-files-found: error
          path: dist/*

  macos:
    needs: prep
    if: needs.prep.outputs.build == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      KELTA_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      # Its own key: the universal release job caches target/<triple>/release, this host build target/release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-host
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # No APPLE_* variables: the app is built unsigned. The updater key only reaches this step.
      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash packaging/build.sh
      # Versioned name: the new bundle is uploaded beside the old one before latest.json points at it.
      - run: |
          mkdir dist && cp target/release/bundle/dmg/*.dmg dist/
          for ext in tar.gz tar.gz.sig; do
            cp "target/release/bundle/macos/Kelta.app.$ext" "dist/Kelta_${KELTA_VERSION}_aarch64.app.$ext"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-macos
          if-no-files-found: error
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/

  publish:
    needs: [prep, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and the `nightly` tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # release notes: the history since the previous nightly
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-nightly.sh "$PWD/dist" "${{ needs.prep.outputs.version }}" "${{ needs.prep.outputs.sha }}"
