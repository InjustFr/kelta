name: bench

# PRs labeled "perf": harness dry run + bundle-size budgets. On demand (workflow_dispatch): also the real
# memory/CPU runs under Xvfb (Linux, Mesa software rendering). Regressions > 10 % over
# fixtures/baseline-{macos,linux}.json (per OS) fail the run.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  budgets:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job level, so an unrelated label event (job skipped) cannot cancel a running benchmark.
    concurrency:
      group: bench-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kelta/ui run build
      - run: node bench/bundle-size.mjs ui/dist
      - run: cargo test -p kelta-bench --locked
      - run: cargo run -p kelta-bench --locked -- --scenario idle-3p10s --dry-run

  memory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config neovim xvfb \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kelta/ui run build
      - run: cargo build --release --locked -p kelta-desktop --features tauri/custom-protocol
      - run: cargo build --release --locked -p kelta-bench -p tui-sim
      - name: Scenarios
        run: |
          for s in idle-3p10s background idle-cpu; do
            xvfb-run -a target/release/kelta-bench --scenario "$s" --app target/release/kelta
          done
