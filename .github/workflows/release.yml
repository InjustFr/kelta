name: release

# Manual only (Actions, release, Run workflow on main). semantic-release (.releaserc.json) reads the conventional
# commits since the last vX.Y.Z tag, sets the version (scripts/set-version.py), prepends the notes to CHANGELOG.md,
# pushes the release commit and the tag to main and opens a draft release. The same run then builds that commit:
# deb + AppImage for amd64 and arm64, the universal dmg, the signed updater bundles. The publish job uploads them
# with latest.json and only then publishes the draft, so releases/latest never lacks its manifest. Last, it runs
# nightly.yml on the release commit. Everything happens in this run: refs pushed with GITHUB_TOKEN trigger no
# workflow. A failed build leaves the tag and the draft: re-run the failed jobs. `dry_run` pushes and publishes
# nothing but still builds, with the version semantic-release would pick.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version and build, publish nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read # the ghcr.io/injustfr/kelta-ci image

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release commit, the tag and the draft release
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # semantic-release reads the tags and the history
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A release without signed updater bundles would strand every installed copy: refuse before tagging.
          [[ "$HAS_KEY" == true ]] || { echo "::error::updater key secrets missing (CONTRIBUTING, Nightly builds)"; exit 1; }
          # The version output comes from verifyReleaseCmd (.releaserc.json); none when there is nothing to release.
          if [[ "$DRY_RUN" == true ]]; then pnpm exec semantic-release --dry-run; else pnpm exec semantic-release; fi
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT" # the release commit (HEAD itself in a dry run)

  linux:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The prebuilt image (ci-image.yml, amd64 + arm64) has the system packages and the Rust toolchain.
    container:
      image: ghcr.io/injustfr/kelta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1" # no FUSE in a container for linuxdeploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/dev.kelta.Kelta.desktop
          appstreamcli validate --no-net packaging/linux/dev.kelta.Kelta.metainfo.xml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release # nightly and release share their release builds
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The signing key only reaches this step.
      - env:
          KELTA_VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash packaging/build.sh
      # Flat: several paths would upload as deb/ and appimage/ folders.
      - run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ runner.arch }}
          if-no-files-found: error
          path: dist/*

  macos:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-14
    timeout-minutes: 30
    env:
      KELTA_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Caches both targets' dependencies (target/<triple>/release).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          cache-on-failure: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Universal dmg + updater bundle
        env:
          UNIVERSAL: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # With the APPLE_* secrets Tauri signs and notarizes. Without them: ad-hoc signed ("-") and not notarized,
        # like nightly (see nightly.yml). Unset: Tauri could take the empty values for a certificate to import.
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
          fi
          bash packaging/build.sh
      # Versioned name: one universal bundle, which latest.json lists for both Macs.
      - run: |
          out=target/universal-apple-darwin/release/bundle
          mkdir dist && cp "$out"/dmg/*.dmg dist/
          for ext in tar.gz tar.gz.sig; do
            cp "$out/macos/Kelta.app.$ext" "dist/Kelta_${KELTA_VERSION}_universal.app.$ext"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          if-no-files-found: error
          path: dist/*

  publish:
    needs: [version, linux, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release assets
      actions: write # gh workflow run nightly.yml
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Size budgets
        run: |
          for f in dist/*.dmg; do [ "$(stat -c %s "$f")" -le 20971520 ] || { echo "$f over 20 MB"; exit 1; }; done
          for f in dist/*.deb; do [ "$(stat -c %s "$f")" -le 15728640 ] || { echo "$f over 15 MB"; exit 1; }; done
      - name: Updater manifest and checksums
        run: |
          gh release view "v$VERSION" --json body --jq .body > "$RUNNER_TEMP/notes"
          bash scripts/update-manifest.sh dist "$VERSION" "$RUNNER_TEMP/notes" \
            "https://github.com/InjustFr/kelta/releases/download/v$VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS)
      # Assets on the draft first, then public: releases/latest never points at a release without latest.json.
      - name: Publish the release
        run: |
          gh release upload "v$VERSION" dist/* --clobber
          gh release edit "v$VERSION" --draft=false --latest
      - name: Nightly on the release commit
        run: gh workflow run nightly.yml --ref main -f sha="$SHA"
