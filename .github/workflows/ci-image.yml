name: ci-image

# Publishes docker/ubuntu-build.Dockerfile as ghcr.io/injustfr/kelta-ci:latest (amd64 for the runners, arm64
# for scripts/linux-check.sh on Apple silicon). The Linux jobs of ci, nightly and release run in it, so no
# job installs system packages on every run.
on:
  push:
    branches: [main]
    paths: ["docker/ubuntu-build.Dockerfile", "scripts/install-nvim.sh", ".github/workflows/ci-image.yml"]
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/ubuntu-build.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/injustfr/kelta-ci:latest
