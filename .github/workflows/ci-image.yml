name: ci-image

# Publishes docker/ubuntu-build.Dockerfile as ghcr.io/injustfr/kelta-ci:latest (amd64 for the runners, arm64
# for scripts/linux-check.sh on Apple silicon). The Linux jobs of ci, nightly and release run in it, so no
# job installs system packages on every run.
on:
  push:
    branches: [main, feat/ticket-245] # TEMP bootstrap, removed before merge
    paths: ["docker/ubuntu-build.Dockerfile", "scripts/install-nvim.sh", ".github/workflows/ci-image.yml"]
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ubuntu-build.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/injustfr/kelta-ci:latest
