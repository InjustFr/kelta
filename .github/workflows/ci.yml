name: ci

# Runs on ready (non-draft) pull requests and on push to main (ticket passes merge after scripts/ci-local.sh;
# this confirms on the runners). PR jobs run only for the areas the PR touches.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  # A new PR push cancels the previous run; every main commit and manual run keeps its own.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # the ghcr.io/injustfr/kelta-ci image

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # A push to main or a manual run (workflow_dispatch) runs every job.
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      packaging: ${{ github.event_name != 'pull_request' || steps.filter.outputs.packaging == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'xtask/**'
              - 'bench/**'
              - 'fixtures/**'
              - 'schema/**'
              - 'ui/src/lib/gen/**'
              - 'Cargo.*'
              - '*.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'eslint.config.js'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - '.github/workflows/ci.yml'

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # Linux runs in the prebuilt image (ci-image.yml: system packages, Neovim, Rust, nextest); an empty image
    # runs on the macOS host.
    container:
      image: ${{ startsWith(matrix.os, 'ubuntu') && 'ghcr.io/injustfr/kelta-ci:latest' || '' }}
      options: --init # PID 1 reaps orphans: the process-group kill tests wait for their grandchildren to go
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15 # budget: 10 min warm; a hung test must not burn macOS minutes
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x: PRs (checked locally first) run Linux only, main and manual runs both OSes.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04","macos-14"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # macOS gets by hand what the Linux image has.
      - if: runner.os == 'macOS'
        run: sudo bash scripts/install-nvim.sh
      - if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      # Saved even when the job fails (a red run must not leave the next one cold); PRs only read it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      # nextest gives every test its own process and the per-test timeouts in .config/nextest.toml.
      - name: cargo-nextest (pinned, as in docker/ubuntu-build.Dockerfile)
        if: runner.os == 'macOS'
        run: |
          curl -fsSLo nextest.tgz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-universal-apple-darwin.tar.gz"
          echo "6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b  nextest.tgz" | shasum -a 256 -c -
          tar -xzf nextest.tgz -C ~/.cargo/bin && rm nextest.tgz
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/qa.sh rust

  ui:
    name: ui (checks, vitest, playwright)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/qa.sh ui
      - run: pnpm --filter @kelta/ui exec playwright install chromium # the runner image has Chrome's system libraries
      - run: pnpm --filter @kelta/ui run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  packaging-meta:
    name: desktop entry + AppStream
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/injustfr/kelta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          desktop-file-validate packaging/linux/dev.kelta.Kelta.desktop
          appstreamcli validate --no-net packaging/linux/dev.kelta.Kelta.metainfo.xml
