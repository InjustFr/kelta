name: ci

# Runs on ready (non-draft) pull requests and on push to main (ticket passes merge after scripts/ci-local.sh;
# this confirms on the runners). PR jobs run only for the areas the PR touches.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  # A new PR push cancels the previous run; every main commit and manual run keeps its own.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # the ghcr.io/injustfr/kelta-ci image

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # A push to main or a manual run (workflow_dispatch) runs every job.
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      packaging: ${{ github.event_name != 'pull_request' || steps.filter.outputs.packaging == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'xtask/**'
              - 'bench/**'
              - 'fixtures/**'
              - 'schema/**'
              - 'ui/src/lib/gen/**'
              - 'Cargo.*'
              - '*.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'eslint.config.js'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - '.github/workflows/ci.yml'

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # Linux runs in the prebuilt image (ci-image.yml: system packages, Neovim, Rust, nextest); an empty image
    # runs on the macOS host.
    container:
      image: ${{ startsWith(matrix.os, 'ubuntu') && 'ghcr.io/injustfr/kelta-ci:latest' || '' }}
      options: --init # PID 1 reaps orphans: the process-group kill tests wait for their grandchildren to go
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15 # budget: 10 min warm; a hung test must not burn macOS minutes
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x: PRs (checked locally first) run Linux only, main and manual runs both OSes.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04","macos-14"]') }}
    steps:
      - uses: actions/checkout@v4
      # macOS gets by hand what the Linux image has.
      - if: runner.os == 'macOS'
        run: sudo bash scripts/install-nvim.sh
      - if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      # Saved even when the job fails (a red run must not leave the next one cold); PRs only read it.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      # nextest gives every test its own process and the per-test timeouts in .config/nextest.toml.
      - name: cargo-nextest (pinned, as in docker/ubuntu-build.Dockerfile)
        if: runner.os == 'macOS'
        run: curl -fsSL "https://get.nexte.st/0.9.148/mac" | tar -xz -C ~/.cargo/bin
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/qa.sh rust

  ui:
    name: ui (checks, vitest, playwright)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/qa.sh ui
      - run: pnpm --filter @kelta/ui exec playwright install chromium # the runner image has Chrome's system libraries
      - run: pnpm --filter @kelta/ui run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results

  deny:
    name: cargo-deny licenses
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  packaging-meta:
    name: desktop entry + AppStream
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/injustfr/kelta-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          desktop-file-validate packaging/linux/dev.kelta.Kelta.desktop
          appstreamcli validate --no-net packaging/linux/dev.kelta.Kelta.metainfo.xml
