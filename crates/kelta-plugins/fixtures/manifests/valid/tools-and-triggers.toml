id = "web-dash"
name = "Dash"
version = "0.1.0-beta.1"
kelta_api = ">=0.1, <0.2"
description = "Web tool + triggers"
author = "a"
license = "Apache-2.0"
permissions = ["sessions.spawn", "exec:sl", "exec:sh", "net:*.example.com", "net:127.0.0.1"]
activation = ["onEvent:claude.*", "onProjectOpen"]

[[contributes.tools]]
id = "isl"
label = "Sapling ISL"
kind = "web"
start = { command = "sl", args = ["web", "--port", "{port}", "--cwd", "{repo.path}"], ready = { stdout_json = "url" }, ready_timeout_ms = 10000, stop = { signal = "TERM", grace_ms = 3000 } }
embed = "auto"
url_is_secret = true

[[contributes.triggers]]
id = "guard"
on = "ticket.before_start"
blocking = true
do = [ { action = "run", command = "sh", args = ["-c", "git -C {repo.path|shell} diff --quiet || echo '{\"veto\":\"dirty\"}'"] } ]

[[contributes.triggers]]
id = "clippy"
on = "claude.file_edited"
match = { "payload.path" = "glob:*.rs", "session.kind" = ["claude", "!shell"] }
debounce_ms = 1500
do = [ { action = "http", url = "https://ci.example.com/hook", body = "{payload|json}" } ]
