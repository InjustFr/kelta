[package]
name = "kelta-codehosts"
description = "Code-host providers: GitHub (GraphQL + REST), GitLab, Bitbucket Cloud, Gitea/Forgejo (L5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[dependencies]
kelta-proto = { workspace = true }
kelta-http = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
time = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
kelta-proto = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
